# vCGE CI: web tests, plus desktop builds and tests on Linux, macOS and Windows.
# Actions are pinned to full commit SHAs (tag in the trailing comment) so a moved tag cannot change what runs.
name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (unit + browser e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Committed generated files are up to date
        run: |
          npm run build:css
          npm run vendor
          git diff --exit-code -- src/styles/tailwind.css src/vendor

      - name: Unit tests
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser e2e (source)
        run: npm run test:e2e

      - name: Browser e2e (Vite build)
        run: |
          npm run build
          SERVE_DIR=dist npm run test:e2e

      - name: Icon detection accuracy (held-out icon sets)
        run: npm run test:icons

  # The same browser suite in the other engines and branded browsers, and on phone-sized screens (Chromium runs in "web"),
  # plus the whole suite in the plain edition (notes/plain-edition-plan.md), so a change can't break it unseen.
  browsers:
    name: Browser e2e (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Firefox, browser: firefox, install: firefox }
          - { name: WebKit, browser: webkit, install: webkit }
          - { name: Google Chrome, browser: chrome, install: chrome }
          - { name: Microsoft Edge, browser: msedge, install: msedge }
          - { name: iPhone, browser: webkit, install: webkit, device: iPhone 15 }
          - { name: Android phone, browser: chromium, install: chromium, device: Galaxy S24 }
          - { name: Plain edition, browser: chromium, install: chromium, edition: plain }
    env:
      VCGE_BROWSER: ${{ matrix.browser }}
      VCGE_DEVICE: ${{ matrix.device }}
      VCGE_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install ${{ matrix.name }} for Playwright
        run: npx playwright install --with-deps ${{ matrix.install }}


      - name: Browser e2e (source)
        run: npm run test:e2e

      - name: Browser e2e (Vite build)
        run: |
          npm run build
          SERVE_DIR=dist npm run test:e2e

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: src-tauri

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev \
            webkit2gtk-driver gnome-keyring libsecret-tools xvfb dbus-x11

      - run: npm ci

      - name: Rust tests (keychain device key)
        working-directory: src-tauri
        run: cargo test --locked

      - name: Release build + installers
        run: npx tauri build

      - name: Desktop e2e (release binary, real Secret Service)
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --version 2.0.6 --locked
          VCGE_APP="$PWD/src-tauri/target/release/vcge" npm run test:tauri

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vcge-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14
