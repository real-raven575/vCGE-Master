# vCGE CI: web tests, plus the app wrappers: desktop builds and tests on Linux, macOS and Windows, and the Android app
# built and run on an emulator.
# Actions are pinned to full commit SHAs (tag in the trailing comment) so a moved tag cannot change what runs.
name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (unit + browser e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Committed generated files are up to date
        run: |
          npm run build:css
          npm run vendor
          git diff --exit-code -- src/styles/tailwind.css src/vendor

      - name: Unit tests
        run: npm test

      - name: App wrapper checks (no internet, permissions, Tauri lock)
        run: npm run test:wrappers

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser e2e (source)
        run: npm run test:e2e

      - name: Browser e2e (Vite build)
        run: |
          npm run build
          SERVE_DIR=dist npm run test:e2e

      - name: Icon detection accuracy (held-out icon sets)
        run: npm run test:icons

  # The same browser suite in the other engines and branded browsers, and on phone-sized screens (Chromium runs in "web"),
  # plus the whole suite in the plain edition (notes/plain-edition-plan.md), so a change can't break it unseen.
  browsers:
    name: Browser e2e (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 95   # install retries can take up to 32 min (2026-11-23). WebKit on the iPhone profile: 23-30 min by 2026-11-14 (cut off at 30); by 2026-11-22 each pass
                          # (source, then Vite build) took about 24 min, and the second was cut off at 45 (runs 44966180632, 44851801150)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Firefox, browser: firefox, install: firefox }
          - { name: WebKit, browser: webkit, install: webkit }
          - { name: Google Chrome, browser: chrome, install: chrome }
          - { name: Microsoft Edge, browser: msedge, install: msedge }
          - { name: iPhone, browser: webkit, install: webkit, device: iPhone 15 }
          - { name: Android phone, browser: chromium, install: chromium, device: Galaxy S24 }
          - { name: Plain edition, browser: chromium, install: chromium, edition: plain }
    env:
      VCGE_BROWSER: ${{ matrix.browser }}
      VCGE_DEVICE: ${{ matrix.device }}
      VCGE_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A stuck package mirror once held this step for the job's whole 30 minutes; a healthy install takes under 8.
      # On 2026-11-23 a crawling mirror hit the old 10-minute limit for hours, so the script retries (up to 3 tries,
      # 9 min each, then archive.ubuntu.com). It only changes the install; every test still runs.
      - name: Install ${{ matrix.name }} for Playwright
        run: bash scripts/install-browser.sh ${{ matrix.install }}
        timeout-minutes: 32


      - name: Browser e2e (source)
        run: npm run test:e2e

      - name: Browser e2e (Vite build)
        run: |
          npm run build
          SERVE_DIR=dist npm run test:e2e

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: src-tauri

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev \
            webkit2gtk-driver gnome-keyring libsecret-tools xvfb dbus-x11

      - run: npm ci

      - name: Rust tests (keychain device key)
        working-directory: src-tauri
        run: cargo test --locked

      - name: Release build + installers
        run: npx tauri build

      - name: Desktop e2e (release binary, real Secret Service)
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --version 2.0.6 --locked
          VCGE_APP="$PWD/src-tauri/target/release/vcge" npm run test:tauri

      - name: Wrapper smoke test (installers made, release app opens and stays open)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:desktop-smoke; else npm run test:desktop-smoke; fi

      # Microsoft Store package (store/README.md). The Store signs the real one; here a copy is signed with a throwaway
      # certificate (made for this run, subject = the package's publisher) only to prove it installs.
      - name: MSIX for the Microsoft Store (pack, then test-install a signed copy)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node scripts/make-msix.mjs
          $msix = Get-ChildItem src-tauri/target/release/bundle/msix/*.msix | Select-Object -First 1
          $id = Get-Content store/msix/identity.json -Raw | ConvertFrom-Json
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $id.publisher -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          $pfx = Join-Path $env:RUNNER_TEMP 'test.pfx'
          $pw = ConvertTo-SecureString -String ([guid]::NewGuid().ToString()) -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $pw | Out-Null
          $signed = Join-Path $env:RUNNER_TEMP 'signed.msix'
          Copy-Item $msix.FullName $signed
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My $signed
          if ($LASTEXITCODE) { throw 'signtool failed' }
          Add-AppxPackage -Path $signed
          $pkg = Get-AppxPackage -Name $id.identityName
          if (-not $pkg) { throw 'the MSIX did not install' }
          Write-Host "Installed $($pkg.PackageFullName)"
          Remove-AppxPackage $pkg.PackageFullName
          Remove-Item $pfx, $signed

      # Each download says its version, platform and build: vCGE-0.8.1-W417_x64-setup.exe (raven575, 2026-11-15)
      - name: Name the downloads
        id: names
        shell: bash
        run: |
          case "$RUNNER_OS" in Windows) P=W ;; macOS) P=M ;; *) P=L ;; esac
          node scripts/name-downloads.mjs src-tauri/target/release/bundle "$P" "${{ github.run_number }}"
          echo "tag=$(node -p "require('./package.json').version")-${P}${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Upload installers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node.js 24)
        with:
          name: vCGE-${{ steps.names.outputs.tag }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14

  # Android wrapper: the same web build inside a Tauri Android app (src-tauri/gen/android). Built as a release APK for
  # phones (arm64, armv7) and the emulator (x86_64), then installed on an Android 14 emulator and run through its paces
  # (tests/android-smoke.mjs). The APK is signed with a throwaway key made for this run only, so it installs for testing;
  # a beta APK people can update in place needs one lasting key, kept in GitHub Actions secrets, never in the repo.
  android:
    name: Android (build + emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # Play needs a higher version code on every upload: the CI run number always grows (gen/android build.gradle.kts).
      VCGE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Android SDK paths, JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          # One place for the virtual phone, so avdmanager writes it where the emulator looks.
          mkdir -p "$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"

      # The emulator boots while the app builds.
      - name: Start Android 14 emulator
        timeout-minutes: 15
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          IMAGE="system-images;android-34;google_apis;x86_64"
          yes | sdkmanager --install emulator "$IMAGE" platform-tools > /dev/null
          echo no | avdmanager create avd -n vcge -k "$IMAGE" -d pixel_6
          emulator -list-avds | grep -qx vcge
          nohup emulator -avd vcge -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -camera-back emulated > "$RUNNER_TEMP/emulator.log" 2>&1 &

      - name: Rust toolchain + Android targets
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: src-tauri
          key: android

      - run: npm ci

      - name: Build release APK
        run: npx tauri android build --apk --target aarch64 --target armv7 --target x86_64

      - name: Sign with a throwaway test key (made for this run, then gone)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$BT" >> "$GITHUB_PATH"
          IN=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          export KS_PASS=$(openssl rand -hex 24)
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass "$KS_PASS" -keypass "$KS_PASS" -alias test \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=vCGE CI test build" > /dev/null
          mkdir -p apk
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          # Named for its version, platform and build: vCGE-0.8.1-A417.apk (raven575, 2026-11-15)
          TAG="$(node -p "require('./package.json').version")-A${{ github.run_number }}"
          echo "APK_TAG=$TAG" >> "$GITHUB_ENV"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/test.jks" --ks-pass env:KS_PASS --out "apk/vCGE-$TAG.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/test.jks"
          "$BT/apksigner" verify "apk/vCGE-$TAG.apk"
          ls -l apk

      # Google Play takes an Android App Bundle. Built every run and checked (three chips, no INTERNET permission);
      # the play-sign job below signs it.
      - name: Build Play bundle (.aab)
        run: |
          npx tauri android build --aab --target aarch64 --target armv7 --target x86_64
          AAB=$(ls src-tauri/gen/android/app/build/outputs/bundle/*Release/*.aab | head -1)
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          unzip -l "$AAB" | grep -E 'base/lib/(arm64-v8a|armeabi-v7a|x86_64)/' | awk '{print $4}' | cut -d/ -f3 | sort -u | tee "$RUNNER_TEMP/abis"
          [ "$(wc -l < "$RUNNER_TEMP/abis")" = 3 ] || { echo "bundle is missing a chip"; exit 1; }
          unzip -p "$AAB" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/aab-manifest.pb"
          grep -q 'android.permission.CAMERA' "$RUNNER_TEMP/aab-manifest.pb" || { echo "bundle manifest unreadable"; exit 1; }
          if grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/aab-manifest.pb"; then echo "bundle asks for INTERNET"; exit 1; fi

      - name: Upload Play bundle (unsigned)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node.js 24)
        with:
          name: vcge-play-unsigned
          path: ${{ env.AAB }}
          if-no-files-found: error
          retention-days: 14

      - name: Wait for the emulator
        timeout-minutes: 10
        run: |
          # Stops at once if the emulator has quit, with its log, instead of waiting out the timeout.
          until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            pgrep -f "qemu-system|emulator -avd" > /dev/null || { tail -50 "$RUNNER_TEMP/emulator.log"; exit 1; }
            sleep 3
          done
          # A just-booted system is still busy for a while; give it time so it doesn't stall the app's first start.
          sleep 45
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Android e2e (install, open, Welcome to Capture, no internet, no crash)
        run: npm run test:android -- apk/*.apk android-smoke

      - name: Emulator log
        if: failure()
        run: tail -100 "$RUNNER_TEMP/emulator.log" || true

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node.js 24)
        with:
          name: vCGE-${{ env.APK_TAG }}
          path: apk/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node.js 24)
        with:
          name: vcge-android-screens
          path: android-smoke/
          if-no-files-found: ignore
          retention-days: 14

  # Signs the Play bundle with the upload key (raven575 chose "Protected CI", 2026-11-19 17:08 UTC). The key lives only
  # in the "play-upload" environment's secrets: that environment allows the main branch only and waits for raven575 to
  # click Approve, so no other branch, pull request or workflow run can read it. Google holds the app signing key
  # (Play App Signing); this upload key can be reset by Google if it is ever lost or leaked.
  play-sign:
    name: Sign Play bundle (main, approved by raven575)
    needs: android
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: play-upload
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 (Node.js 24)
        with:
          name: vcge-play-unsigned
          path: unsigned
      - name: Sign with the upload key
        env:
          PLAY_UPLOAD_KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          [ -n "$PLAY_UPLOAD_KEYSTORE_B64" ] || { echo "The play-upload environment has no upload key yet."; exit 1; }
          [ -n "$PLAY_UPLOAD_KEY_ALIAS" ] || { echo "The play-upload environment has no PLAY_UPLOAD_KEY_ALIAS secret (the key's alias, e.g. vcge-upload)."; exit 1; }
          [ -n "$PLAY_UPLOAD_KEYSTORE_PASSWORD" ] || { echo "The play-upload environment has no PLAY_UPLOAD_KEYSTORE_PASSWORD secret."; exit 1; }
          trap 'rm -f "$RUNNER_TEMP/upload.jks"' EXIT
          echo "$PLAY_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          mkdir -p aab
          cp unsigned/*.aab "aab/vCGE-$(date -u +%Y%m%d)-A${{ github.run_number }}.aab"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass:env PLAY_UPLOAD_KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 aab/*.aab "$PLAY_UPLOAD_KEY_ALIAS"
          jarsigner -verify aab/*.aab | tail -1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node.js 24)
        with:
          name: vCGE-play-A${{ github.run_number }}
          path: aab/
          if-no-files-found: error
          retention-days: 14
