[package]
name = "vcge"
version = "0.1.0"
description = "vCard Generator Engine (vCGE) - offline-first digital business card engine"
authors = ["raven575", "Team vCGE (Claude)", "Gemini"]
license = "MIT"
repository = "https://github.com/real-raven575/vCGE-Master"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vcge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
# OS credential stores (macOS Keychain, Windows Credential Manager, Linux Secret Service): only to delete the old device key.
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
